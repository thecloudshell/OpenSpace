# DRN OpenSpace dashboard — web + API.
#
# Usage (from the repo root):
#   docker compose -f deploy/docker-compose.dashboard.yml up -d --build
# Then open http://127.0.0.1:4799

services:
  dashboard-api:
    build:
      context: ..
      dockerfile: Dockerfile.dashboard-api
    image: openspace-dashboard-api:latest
    container_name: openspace-dashboard-api
    expose:
      - '7788'
    volumes:
      - openspace-workspace:/workspace
    restart: unless-stopped

  dashboard-web:
    build:
      context: ..
      dockerfile: Dockerfile.dashboard-web
      args:
        # Baked into the rewrite destination at `next build` time.
        API_INTERNAL_URL: http://dashboard-api:7788
    image: openspace-dashboard-web:latest
    container_name: openspace-dashboard-web
    ports:
      - '127.0.0.1:4799:4799'
    environment:
      # Kept for parity with the build arg; rewrites use the baked value.
      API_INTERNAL_URL: http://dashboard-api:7788
    depends_on:
      - dashboard-api
    restart: unless-stopped

volumes:
  openspace-workspace:
